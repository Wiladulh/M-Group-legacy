name: ESP32 Cashier Build

on:
  workflow_dispatch:
  push:
    paths:
      - "esp32/cashier/**"
      - "platformio.ini"
      - ".github/workflows/esp32-cashier.yml"

jobs:
  build-cashier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade platformio

      - name: Stage Cashier Sources
        run: |
          mkdir -p src
          cp esp32/cashier/*.ino src/
          cp esp32/cashier/*.h src/

      - name: Build ESP32 Cashier
        run: pio run -e esp32dev

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nvm-esp32-cashier-firmware
          path: .pio/build/esp32dev/firmware.bin
